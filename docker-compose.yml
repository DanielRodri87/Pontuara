services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pontuara-backend
    env_file:
      - ./backend/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "7000:8000" # <-- O host acessa na 7000, e redireciona para a 8000 do container
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://pontuara.onrender.com
    container_name: pontuara-frontend
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    restart: unless-stopped